# Every hour on GitHub's servers (dcs.whoi.edu is blocked on some home networks):
#   1. fetch live WHOI Cape Cod Bay buoy detections -> commit data/live_hourly.csv
#   2. run the forecasting pipeline on it and rebuild the website
#   3. publish the website on GitHub Pages (https://<user>.github.io/<repo>/)
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: live WHOI data

on:
  schedule:
    - cron: "23 * * * *"      # every hour at :23 UTC (GitHub may start it a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab
  push:                       # code or website changes go live at once (the bot's data commits use
    branches: [main]          # GITHUB_TOKEN, which never triggers workflows, so this cannot loop)
    paths-ignore: ["data/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-whoi
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "numpy>=1.24" "pandas>=2.2" "scipy>=1.10" "statsmodels>=0.14" "scikit-learn>=1.3" "matplotlib>=3.7"
      - name: Restore cached WHOI day pages
        uses: actions/cache@v4
        with:
          path: data/whoi_cache
          key: whoi-${{ github.run_id }}
          restore-keys: whoi-
      - name: Fetch live WHOI data
        id: fetch
        continue-on-error: true      # WHOI down: still rebuild the site from the last committed data
        run: python fetch_whoi.py --days 60 --out data/live_hourly.csv
      - name: Commit if the data changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_hourly.csv data/live_hourly.source.json
          git diff --cached --quiet || git commit -m "live WHOI data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase && git push
      - name: Forecast and rebuild the website
        run: |
          python run_all.py --skip-detector --hourly-csv data/live_hourly.csv
          python site/build_site.py
          mkdir -p _site && cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Backup clock: GitHub's cron can be delayed for hours or skipped (on this repo it had not fired once
  # 5 h after setup). Each push, manual or chained run waits until :23 of the next hour and starts the next run.
  # The chain stops by itself once real scheduled runs appear, and only the oldest chain survives.
  next:
    needs: deploy
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the next hour, then start the next run
        run: |
          now=$(date +%s); wait=$(( (3600 - now % 3600 + 23 * 60) % 3600 ))
          [ "$wait" -lt 600 ] && wait=$(( wait + 3600 ))
          echo "sleeping $wait s"; sleep "$wait"
          wf=live_whoi.yml
          recent_sched=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?event=schedule&per_page=1" \
            --jq "[.workflow_runs[] | select((now - (.created_at | fromdateiso8601)) < 7200)] | length")
          others=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.status != \"completed\" and .id != $GITHUB_RUN_ID and (.id < $GITHUB_RUN_ID or .status == \"queued\"))] | length")
          if [ "$recent_sched" -gt 0 ]; then echo "GitHub cron is running: backup clock stops"; exit 0; fi
          if [ "$others" -gt 0 ]; then echo "another run is active or queued: not starting a duplicate"; exit 0; fi
          gh workflow run "$wf" --ref main -R "$GITHUB_REPOSITORY" && echo "next run started"
