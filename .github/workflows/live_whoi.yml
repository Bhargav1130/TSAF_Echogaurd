# Every hour on GitHub's servers (dcs.whoi.edu is blocked on some home networks):
#   1. fetch live WHOI Cape Cod Bay buoy detections -> commit data/live_hourly.csv
#   2. run the forecasting pipeline on it and rebuild the website
#   3. publish the website on GitHub Pages (https://<user>.github.io/<repo>/)
# One-time setup: Settings > Pages > Source: "GitHub Actions".
name: live WHOI data

on:
  schedule:
    - cron: "23 * * * *"      # every hour at :23 UTC (GitHub may start it a few minutes late)
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab
  push:                       # code or website changes go live at once (the bot's data commits use
    branches: [main]          # GITHUB_TOKEN, which never triggers workflows, so this cannot loop)
    paths-ignore: ["data/**", "**.md"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:              # on the job, not the workflow: a sleeping `next` job must not hold back new runs
      group: live-whoi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "numpy>=1.24" "pandas>=2.2" "scipy>=1.10" "statsmodels>=0.14" "scikit-learn>=1.3" "matplotlib>=3.7"
      - name: Restore cached WHOI day pages
        uses: actions/cache@v4
        with:
          path: data/whoi_cache
          key: whoi-${{ github.run_id }}
          restore-keys: whoi-
      - name: Fetch live WHOI data
        id: fetch
        continue-on-error: true      # WHOI down: still rebuild the site from the last committed data
        run: python fetch_whoi.py --days 60 --out data/live_hourly.csv
      - name: Commit if the data changed
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live_hourly.csv data/live_hourly.source.json
          git diff --cached --quiet || git commit -m "live WHOI data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase && git push
      - name: Forecast and rebuild the website
        run: |
          python run_all.py --skip-detector --hourly-csv data/live_hourly.csv
          python site/build_site.py
          mkdir -p _site && cp site/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Backup clock: GitHub's cron on this repo is unreliable (it fired once in 12 h). Every run, scheduled or not,
  # waits until :45 of the next hour (at least 40 min) and starts a run, unless a newer run exists by then:
  # that run owns the chain. So the cron run (:23) takes over when it fires, and the clock fills in when it doesn't.
  next:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for the next hour, then start the next run unless a newer run exists
        run: |
          now=$(date +%s); wait=$(( (3600 - now % 3600 + 45 * 60) % 3600 ))
          [ "$wait" -lt 2400 ] && wait=$(( wait + 3600 ))
          echo "sleeping $wait s"; sleep "$wait"
          wf=live_whoi.yml
          newer=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id > $GITHUB_RUN_ID)] | length")
          if [ "$newer" -gt 0 ]; then echo "a newer run exists: it keeps the chain going"; exit 0; fi
          gh workflow run "$wf" --ref main -R "$GITHUB_REPOSITORY" && echo "next run started"
